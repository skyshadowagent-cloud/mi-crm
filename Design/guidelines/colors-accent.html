-sm);background:var(--color-accent-500)"></div><span class="text-subtle" style="font-size:12px">500</span></div><div style="display:grid;gap:4px"><div style="height:44px;border-radius:var(--radius-sm);background:var(--color-accent-600)"></div><span class="text-subtle" style="font-size:12px">600</span></div><div style="display:grid;gap:4px"><div style="height:44px;border-radius:var(--radius-sm);background:var(--color-accent-700)"></div><span class="text-subtle" style="font-size:12px">700</span></div><div style="display:grid;gap:4px"><div style="height:44px;border-radius:var(--radius-sm);background:var(--color-accent-800)"></div><span class="text-subtle" style="font-size:12px">800</span></div><div style="display:grid;gap:4px"><div style="height:44px;border-radius:var(--radius-sm);background:var(--color-accent-900)"></div><span class="text-subtle" style="font-size:12px">900</span></div></div>
