<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:20px;font-size:14px">
<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px"><div class="card" style="gap:8px"><span class="tag tag-success" style="align-self:flex-start"><i class="ph ph-check-circle"></i>Éxito</span><span class="text-subtle" style="font-size:12px">--color-success-fg / -bg · 9.6:1</span></div><div class="card" style="gap:8px"><span class="tag tag-warning" style="align-self:flex-start"><i class="ph ph-clock"></i>Aviso</span><span class="text-subtle" style="font-size:12px">--color-warning-fg / -bg · 9.3:1</span></div><div class="card" style="gap:8px"><span class="tag tag-danger" style="align-self:flex-start"><i class="ph ph-x-circle"></i>Error</span><span class="text-subtle" style="font-size:12px">--color-danger-fg / -bg · 7.9:1</span></div><div class="card" style="gap:8px"><span class="tag tag-info" style="align-self:flex-start"><i class="ph ph-info"></i>Información</span><span class="text-subtle" style="font-size:12px">--color-info-fg / -bg · 8.6:1</span></div></div>
